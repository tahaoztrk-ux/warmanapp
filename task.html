<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Flow Tuvali</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jerosoler/Drawflow/dist/drawflow.min.css">
    <script src="https://cdn.jsdelivr.net/gh/jerosoler/Drawflow/dist/drawflow.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --bg: #f8fafc; --panel: rgba(255,255,255,0.8); --text: #0f172a; --text-muted: #64748b; 
            --border: #e2e8f0; --primary: #3b82f6; --node-bg: #ffffff; --success: #22c55e;
        }
        [data-theme="dark"] {
            --bg: #0f172a; --panel: rgba(30,41,59,0.8); --text: #f8fafc; --text-muted: #94a3b8; 
            --border: #334155; --primary: #4facfe; --node-bg: #1e293b;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        .top-bar { background: var(--panel); backdrop-filter: blur(10px); padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; z-index: 20; }
        .top-bar h1 { font-size: 1.1rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .btn-action { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: 500; display: flex; align-items: center; gap: 5px; }
        .btn-action:hover { border-color: var(--primary); color: var(--primary); }
        .btn-save { background: var(--primary); color: white; border: none; padding: 8px 20px; border-radius: 8px; }

        .main-content { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        .sidebar { width: 260px; background: var(--panel); backdrop-filter: blur(10px); border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 10; overflow-y: auto; }
        .sidebar h2 { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .drag-item { background: transparent; border: 1px dashed var(--border); padding: 12px; border-radius: 8px; cursor: grab; font-weight: 500; font-size: 0.85rem; display: flex; align-items: center; gap: 10px; transition: 0.2s; }
        .drag-item:hover { border-color: var(--primary); color: var(--primary); background: rgba(59, 130, 246, 0.05); transform: translateY(-2px); }

        .right-sidebar { width: 300px; background: var(--panel); backdrop-filter: blur(10px); border-left: 1px solid var(--border); padding: 20px; z-index: 10; overflow-y: auto; display: flex; flex-direction: column; }
        .checklist-ul { list-style: none; margin-top: 15px; display: flex; flex-direction: column; gap: 8px; }
        .checklist-li { padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: all 0.2s; font-weight: 500; }
        .checklist-li:hover { border-color: var(--primary); }
        .checklist-li.done { border-color: var(--success); background: rgba(34, 197, 94, 0.05); color: var(--text-muted); text-decoration: line-through; }
        .checklist-li i { font-size: 1.2rem; transition: 0.2s; }
        .checklist-li.done i { color: var(--success); }

        .canvas-container { flex: 1; position: relative; }
        #drawflow { width: 100%; height: 100%; background-image: radial-gradient(var(--border) 1.5px, transparent 1.5px); background-size: 25px 25px; }

        .drawflow .drawflow-node { background: var(--node-bg); border: 1px solid var(--border); border-radius: 12px; color: var(--text); box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 260px; padding: 0; transition: border-color 0.3s, box-shadow 0.3s; }
        .drawflow .drawflow-node:hover { border-color: var(--primary); }
        .drawflow .drawflow-node.selected { border-color: #93c5fd !important; background: var(--node-bg) !important; box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.16) !important; }
        .drawflow .drawflow-node.selected .node-header { background: rgba(96, 165, 250, 0.07); }
        .node-header { background: rgba(0,0,0,0.02); padding: 12px 15px; border-bottom: 1px solid var(--border); font-weight: 600; border-radius: 12px 12px 0 0; font-size: 0.85rem; display: flex; align-items: center; gap: 8px; transition: border-top-color 0.3s; }
        .node-content { padding: 15px; font-size: 0.85rem; }
        .node-content input, .node-content textarea { width: 100%; background: transparent; border: 1px solid var(--border); color: var(--text); padding: 8px; border-radius: 6px; margin-top: 5px; outline: none; font-family: inherit; font-size: 0.8rem; }
        
        .drawflow .drawflow-node.node-done { border-color: var(--success) !important; box-shadow: 0 0 15px rgba(34, 197, 94, 0.2) !important; background: rgba(34, 197, 94, 0.02); }
        .drawflow .drawflow-node.node-done .node-header { border-top-color: var(--success) !important; color: var(--success); }
        
        .drawflow .connection .main-path { stroke-width: 3px; transition: stroke 0.3s; }
        .drawflow .connection.path-done .main-path { stroke: var(--success) !important; stroke-width: 4px; }
        .drawflow .connection.path-done .point { stroke: var(--success) !important; fill: var(--success) !important; }

        .floating-controls { position: absolute; bottom: 20px; right: 20px; display: flex; gap: 8px; z-index: 30; }
        .float-btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); width: 40px; height: 40px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        #loadingOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); display: flex; align-items: center; justify-content: center;
            z-index: 9999; color: var(--primary); font-size: 1.5rem; transition: opacity 0.3s;
        }
    </style>
</head>
<body>

    <div id="loadingOverlay"><i class="ph ph-spinner ph-spin"></i> &nbsp; Akış Yükleniyor...</div>

    <div class="top-bar">
        <button class="btn-action" onclick="window.location.href='index.html'"><i class="ph ph-arrow-left"></i> Geri</button>
        <h1 id="projectTitle"><i class="ph-duotone ph-git-merge"></i> Proje Yükleniyor...</h1>
        <button class="btn-action btn-save" onclick="saveFlow()"><i class="ph ph-cloud-arrow-up"></i> Süreci Buluta Kaydet</button>
    </div>

    <div class="main-content">
        <!-- Sol Menü -->
        <div class="sidebar">
            <h2 style="margin-top: 10px;">Süreç Blokları</h2>
            <div class="drag-item" draggable="true" ondragstart="drag(event)" data-node="task"><i class="ph-duotone ph-check-square-offset"></i> İş Adımı</div>
            <div class="drag-item" draggable="true" ondragstart="drag(event)" data-node="decision"><i class="ph-duotone ph-git-branch"></i> Karar Noktası</div>
            <div class="drag-item" draggable="true" ondragstart="drag(event)" data-node="email"><i class="ph-duotone ph-envelope-simple"></i> Bildirim</div>
            <div class="drag-item" draggable="true" ondragstart="drag(event)" data-node="timer"><i class="ph-duotone ph-hourglass"></i> Bekleme (Timer)</div>
            <div class="drag-item" draggable="true" ondragstart="drag(event)" data-node="custom"><i class="ph-duotone ph-note-pencil"></i> Özel Blok</div>
            <div class="drag-item" draggable="true" ondragstart="drag(event)" data-node="end"><i class="ph-duotone ph-flag-checkered"></i> Bitiş</div>
        </div>

        <!-- Orta Tuval -->
        <div class="canvas-container" id="canvas-container">
            <div id="drawflow" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
            <div class="floating-controls">
                <button class="float-btn" onclick="editor.zoom_out()"><i class="ph ph-minus"></i></button>
                <button class="float-btn" onclick="editor.zoom_reset()"><i class="ph ph-corners-out"></i></button>
                <button class="float-btn" onclick="editor.zoom_in()"><i class="ph ph-plus"></i></button>
            </div>
        </div>

        <!-- Sağ İlerleme Paneli -->
        <div class="right-sidebar">
            <h2>Süreç İlerlemesi</h2>
            <p style="font-size:0.75rem; color:var(--text-muted); margin-bottom: 5px;">Tamamlanan adımlara tıklayarak yeşile boyayın.</p>
            <ul class="checklist-ul" id="checklistPanel"></ul>
        </div>
    </div>

    <script>
        document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');

        const SUPABASE_URL = 'https://gpdvqhdhbreiqazlvwlh.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdwZHZxaGRoYnJlaXFhemx2d2xoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTkxMzYsImV4cCI6MjEwNDkzNTEzNn0.vfqPZuGNIwch5MjxDAeCAxCzkIplC3JFbXvdQAGBE58';

        const urlParams = new URLSearchParams(window.location.search);
        const projectId = parseInt(urlParams.get('id'));
        
        let currentProject = null;
        let editor = null;

        // Projeyi Buluttan (Supabase) Çek
        async function fetchProjectData() {
            if (!projectId) { window.location.href = 'planlayici.html'; return; }
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/projects?id=eq.${projectId}&select=*`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                const data = await response.json();
                
                if(data.length === 0) { window.location.href = 'planlayici.html'; return; }
                
                currentProject = data[0];
                currentProject.subtasks = JSON.parse(currentProject.subtasks_json || '[]');
                
                document.getElementById('projectTitle').innerHTML = `<i class="ph-duotone ph-git-merge"></i> ${currentProject.title}`;
                
                initDrawflow();

                // Yükleme ekranını kapat
                document.getElementById('loadingOverlay').style.opacity = '0';
                setTimeout(() => document.getElementById('loadingOverlay').style.display = 'none', 300);

            } catch (err) {
                alert("Proje bilgileri çekilirken bir hata oluştu!");
                console.error(err);
            }
        }

        function initDrawflow() {
            const id = document.getElementById("drawflow");
            editor = new Drawflow(id);
            editor.reroute = true;
            editor.start();

            if (currentProject.flow_data) {
                // Eğer daha önce kaydedilmiş bir akış varsa, onu yükle
                editor.import(JSON.parse(currentProject.flow_data));
            } else {
                // Yeni projeyse sıfırdan varsayılan blokları kur
                const startHtml = `<div>
                    <div class="node-header" style="border-top: 3px solid #22c55e;"><i class="ph-fill ph-rocket"></i> Başlangıç</div>
                    <div class="node-content"><strong>${currentProject.title}</strong><br><textarea df-desc readonly style="background:rgba(0,0,0,0.02);">${currentProject.description || 'Açıklama yok.'}</textarea></div>
                </div>`;
                let sonDugumId = editor.addNode('start', 0, 1, 50, 150, 'start-node', { "desc": currentProject.description, "completed": false }, startHtml);

                if (currentProject.subtasks && currentProject.subtasks.length > 0) {
                    currentProject.subtasks.forEach((madde, index) => {
                        const posX = 380 + (index * 320);
                        const taskHtml = `<div>
                            <div class="node-header" style="border-top: 3px solid #3b82f6;"><i class="ph-duotone ph-check-square-offset"></i> İş Adımı</div>
                            <div class="node-content">
                                <input type="text" df-taskTitle value="${madde.text}">
                                <textarea df-taskDesc placeholder="Detaylar..."></textarea>
                            </div>
                        </div>`;
                        const yeniId = editor.addNode('task', 1, 1, posX, 150, 'task-node', { "taskTitle": madde.text, "taskDesc": "", "completed": false }, taskHtml);
                        editor.addConnection(sonDugumId, yeniId, 'output_1', 'input_1');
                        sonDugumId = yeniId;
                    });
                }
            }

            // Olay Dinleyicilerini Kur
            document.getElementById('drawflow').addEventListener('input', () => { syncChecklist(); });
            editor.on('nodeCreated', () => { syncChecklist(); applyVisuals(); });
            editor.on('nodeRemoved', () => { syncChecklist(); applyVisuals(); });
            editor.on('connectionCreated', () => { applyVisuals(); });
            editor.on('nodeMoved', () => { applyVisuals(); }); 

            setTimeout(() => {
                syncChecklist();
                applyVisuals();
            }, 100);
        }

        // --- Sürükle Bırak İşlemleri ---
        function drag(ev) { ev.dataTransfer.setData("node_type", ev.target.getAttribute('data-node')); }
        function allowDrop(ev) { ev.preventDefault(); }
        function drop(ev) {
            ev.preventDefault();
            const nodeType = ev.dataTransfer.getData("node_type");
            const rect = document.getElementById("drawflow").getBoundingClientRect();
            const posX = (ev.clientX - rect.left) * (editor.precanvas.clientWidth / (editor.precanvas.clientWidth * editor.zoom)) - (editor.precanvas.getBoundingClientRect().x * (editor.precanvas.clientWidth / (editor.precanvas.clientWidth * editor.zoom)));
            const posY = (ev.clientY - rect.top) * (editor.precanvas.clientHeight / (editor.precanvas.clientHeight * editor.zoom)) - (editor.precanvas.getBoundingClientRect().y * (editor.precanvas.clientHeight / (editor.precanvas.clientHeight * editor.zoom)));
            addNodeToCanvas(nodeType, posX, posY);
        }

        function addNodeToCanvas(type, posX, posY) {
            let html = '';
            if (type === 'task') {
                html = `<div><div class="node-header" style="border-top: 3px solid #3b82f6;"><i class="ph-duotone ph-check-square-offset"></i> İş Adımı</div><div class="node-content"><input type="text" df-taskTitle placeholder="Adım adı..."><textarea df-taskDesc placeholder="Detaylar..."></textarea></div></div>`;
                editor.addNode('task', 1, 1, posX, posY, 'task-node', { "taskTitle": "", "taskDesc": "", "completed": false }, html);
            } 
            else if (type === 'decision') {
                html = `<div><div class="node-header" style="border-top: 3px solid #f59e0b;"><i class="ph-duotone ph-git-branch"></i> Karar Noktası</div><div class="node-content"><input type="text" df-decisionDesc placeholder="Örn: Onaylandı mı?"></div></div>`;
                editor.addNode('decision', 1, 2, posX, posY, 'decision-node', { "decisionDesc": "", "completed": false }, html);
            }
            else if (type === 'email') {
                html = `<div><div class="node-header" style="border-top: 3px solid #14b8a6;"><i class="ph-duotone ph-envelope-simple"></i> Bildirim</div><div class="node-content"><input type="text" df-to placeholder="Kime gönderilecek?"></div></div>`;
                editor.addNode('email', 1, 1, posX, posY, 'email-node', { "to": "", "completed": false }, html);
            }
            else if (type === 'timer') {
                html = `<div><div class="node-header" style="border-top: 3px solid #eab308;"><i class="ph-duotone ph-hourglass"></i> Bekleme</div><div class="node-content"><input type="text" df-time placeholder="Örn: 24 Saat, 10 Dk"></div></div>`;
                editor.addNode('timer', 1, 1, posX, posY, 'timer-node', { "time": "", "completed": false }, html);
            }
            else if (type === 'custom') {
                html = `<div><div class="node-header" style="border-top: 3px solid #8b5cf6;"><i class="ph-duotone ph-note-pencil"></i> Özel Blok</div><div class="node-content"><input type="text" df-customTitle placeholder="Başlık yazın..."><textarea df-customDesc placeholder="Notunuzu veya görevinizi yazın..."></textarea></div></div>`;
                editor.addNode('custom', 1, 1, posX, posY, 'custom-node', { "customTitle": "", "customDesc": "", "completed": false }, html);
            }
            else if (type === 'end') {
                html = `<div><div class="node-header" style="border-top: 3px solid #ef4444;"><i class="ph-duotone ph-flag-checkered"></i> Bitiş</div></div>`;
                editor.addNode('end', 1, 0, posX, posY, 'end-node', { "completed": false }, html);
            }
        }

        // --- Sağ Panel ve Renklendirme ---
        function getNodeTitle(node) {
            if(node.name === 'start') return 'Başlangıç: ' + currentProject.title;
            if(node.name === 'task') return node.data.taskTitle || 'İş Adımı';
            if(node.name === 'decision') return node.data.decisionDesc || 'Karar Noktası';
            if(node.name === 'email') return 'Bildirim ' + (node.data.to ? `(${node.data.to})` : '');
            if(node.name === 'timer') return 'Bekleme ' + (node.data.time ? `(${node.data.time})` : '');
            if(node.name === 'custom') return node.data.customTitle || 'Özel Blok';
            if(node.name === 'end') return 'Süreç Sonu';
            return 'Düğüm';
        }

        function syncChecklist() {
            const list = document.getElementById('checklistPanel');
            list.innerHTML = '';
            
            const exportData = editor.export();
            const nodes = Object.values(exportData.drawflow.Home.data);
            
            nodes.sort((a,b) => a.pos_x - b.pos_x).forEach(node => {
                const title = getNodeTitle(node);
                const isDone = node.data.completed ? 'done' : '';
                const icon = node.data.completed ? 'ph-check-circle' : 'ph-circle';
                
                list.innerHTML += `
                    <li class="checklist-li ${isDone}" onclick="toggleNodeDone(${node.id})">
                        <i class="ph ${icon}"></i> 
                        <span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${title}</span>
                    </li>
                `;
            });
        }

        function toggleNodeDone(nodeId) {
            const nodeInfo = editor.getNodeFromId(nodeId);
            nodeInfo.data.completed = !nodeInfo.data.completed;
            editor.updateNodeDataFromId(nodeId, nodeInfo.data);
            
            applyVisuals();
            syncChecklist();
            saveFlowSilent(); 
        }

        function applyVisuals() {
            const exportData = editor.export();
            const nodes = Object.values(exportData.drawflow.Home.data);
            
            nodes.forEach(node => {
                const domNode = document.getElementById('node-' + node.id);
                if (!domNode) return;
                
                const outgoingConnections = document.querySelectorAll('.connection.node_out_node-' + node.id);

                if (node.data.completed) {
                    domNode.classList.add('node-done');
                    outgoingConnections.forEach(c => c.classList.add('path-done'));
                } else {
                    domNode.classList.remove('node-done');
                    outgoingConnections.forEach(c => c.classList.remove('path-done'));
                }
            });
        }

        // --- Buluta Kaydetme İşlemleri (Supabase) ---
        async function saveFlowSilent() {
            if (!editor || !projectId) return;
            const flowData = editor.export();
            
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/projects?id=eq.${projectId}`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({ flow_data: JSON.stringify(flowData) })
                });
            } catch(e) {
                console.error("Arka planda kaydedilemedi", e);
            }
        }

        async function saveFlow() {
            const btn = document.querySelector('.btn-save');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="ph ph-spinner ph-spin"></i> Kaydediliyor...';
            
            await saveFlowSilent();
            
            btn.innerHTML = '<i class="ph ph-check"></i> Buluta Kaydedildi';
            setTimeout(() => { btn.innerHTML = originalHTML; }, 2000);
        }

        // Sayfa yüklenince veriyi Supabase'den çek
        window.onload = fetchProjectData;

    </script>
</body>
</html>
