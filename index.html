<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warman TaskFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jerosoler/Drawflow/dist/drawflow.min.css">
  <link rel="stylesheet" href="css/theme.css?v=20261028.3">
  <link rel="stylesheet" href="css/layout.css?v=20261028.3">
  <link rel="stylesheet" href="css/components.css?v=20261028.3">
  <link rel="stylesheet" href="css/views.css?v=20261028.3">
  <link rel="stylesheet" href="css/flow.css?v=20261028.3">
</head>
<body>
  <div id="bootScreen"><i class="ph ph-spinner ph-spin"></i> Oturum kontrol ediliyor…</div>

  <div id="authScreen" style="display:none">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="logo"><i class="ph-fill ph-flow-arrow"></i></div>
        <div>
          <strong>Warman</strong>
          <span style="display:block;font-size:12px;color:var(--text-muted)">TaskFlow 2.0</span>
        </div>
      </div>
      <h1 id="authTitle">Warman TaskFlow</h1>
      <p class="lead">İş, görev, proje ve süreçleriniz tek yerde.</p>
      <div class="field">
        <label for="authEmail">E-posta</label>
        <input id="authEmail" type="email" autocomplete="username" placeholder="ornek@mail.com">
      </div>
      <div class="field" style="margin-top:12px">
        <label for="authPassword">Şifre</label>
        <input id="authPassword" type="password" autocomplete="current-password" placeholder="••••••••">
      </div>
      <button class="btn btn-primary" id="authBtn" style="width:100%;margin-top:16px"><i class="ph ph-sign-in"></i> Giriş Yap</button>
      <div class="auth-switch"><button type="button" id="authSwitchBtn"><span id="authSwitchText">Hesabın yok mu? Kayıt ol</span></button></div>
    </div>
  </div>

  <div class="mobile-backdrop" id="mobileBackdrop"></div>

  <div id="appShell" style="display:none">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="logo"><i class="ph-fill ph-flow-arrow"></i></div>
        <div>
          <strong>Warman TaskFlow</strong>
          <span>Kişisel çalışma alanı</span>
        </div>
      </div>
      <nav class="nav-list" aria-label="Ana menü">
        <button class="nav-item" data-route="overview"><i class="ph ph-squares-four"></i><span>Genel Bakış</span></button>
        <button class="nav-item" data-route="inbox"><i class="ph ph-tray"></i><span>Gelen Kutusu</span></button>
        <button class="nav-item" data-route="tasks"><i class="ph ph-check-square"></i><span>Görevlerim</span></button>
        <button class="nav-item" data-route="projects"><i class="ph ph-folders"></i><span>Projeler</span></button>
        <button class="nav-item" data-route="flow"><i class="ph ph-git-merge"></i><span>Akış Yönetimi</span></button>
        <button class="nav-item" data-route="calendar"><i class="ph ph-calendar-blank"></i><span>Takvim</span></button>
        <div class="nav-section">İş</div>
        <button class="nav-item" data-route="work"><i class="ph ph-briefcase"></i><span>İş ve Mesai</span></button>
        <button class="nav-item" data-route="analytics"><i class="ph ph-chart-line-up"></i><span>Analizler</span></button>
        <button class="nav-item" data-route="archive"><i class="ph ph-archive"></i><span>Arşiv</span></button>
      </nav>
      <div class="sidebar-foot">
        <button class="nav-item" data-route="settings"><i class="ph ph-gear"></i><span>Ayarlar</span></button>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <button class="icon-btn" id="navToggle" title="Menü"><i class="ph ph-list"></i></button>
        <div class="search-wrap">
          <i class="ph ph-magnifying-glass"></i>
          <input id="globalSearch" placeholder="Görev, proje, etiket ara…  Ctrl+K" aria-label="Global arama">
        </div>
        <div class="topbar-actions">
          <button class="btn btn-primary" id="quickAddBtn"><i class="ph ph-plus"></i> <span class="quick-add-label">Görev</span></button>
          <button class="icon-btn" id="notifyBtn" title="Bildirimler"><i class="ph ph-bell"></i></button>
          <button class="icon-btn" id="themeBtn" title="Tema"><i class="ph ph-moon" id="themeIcon"></i></button>
          <div class="user-chip">
            <div class="avatar" id="userAvatar">W</div>
            <span id="userEmail">—</span>
            <button class="icon-btn" id="logoutBtn" title="Çıkış" style="width:28px;height:28px;border:0;background:transparent"><i class="ph ph-sign-out"></i></button>
          </div>
        </div>
      </header>
      <section id="view"></section>
    </div>

    <aside class="detail-panel" id="detailPanel">
      <div class="detail-head">
        <strong id="detailTitle">Detay</strong>
        <button class="icon-btn" id="detailClose" aria-label="Kapat"><i class="ph ph-x"></i></button>
      </div>
      <div class="detail-body" id="detailBody"></div>
    </aside>
  </div>

  <div class="toast-stack" id="toastStack"></div>

  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://npmcdn.com/flatpickr/dist/l10n/tr.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/jerosoler/Drawflow/dist/drawflow.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=20261028.3"></script>
  <script src="js/utils.js?v=20261028.3"></script>
  <script src="js/payroll.js?v=20261028.3"></script>
  <script src="js/store.js?v=20261028.3"></script>
  <script src="js/api.js?v=20261028.3"></script>
  <script src="js/auth.js?v=20261028.3"></script>
  <script src="js/ui.js?v=20261028.3"></script>
  <script src="js/router.js?v=20261028.3"></script>
  <script src="js/modules/tasks.js?v=20261028.3"></script>
  <script src="js/modules/projects.js?v=20261028.3"></script>
  <script src="js/modules/flow.js?v=20261028.3"></script>
  <script src="js/modules/dashboard.js?v=20261028.3"></script>
  <script src="js/modules/calendar.js?v=20261028.3"></script>
  <script src="js/modules/work.js?v=20261028.3"></script>
  <script src="js/modules/analytics.js?v=20261028.3"></script>
  <script src="js/modules/settings.js?v=20261028.3"></script>
  <script src="js/app.js?v=20261028.3"></script>
</body>
</html>
