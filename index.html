<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warman TaskFlow - Giriş</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/tr.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Supabase JS Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg: #f8fafc; --panel: rgba(255, 255, 255, 0.85); --text: #0f172a; --text-muted: #64748b; 
            --border: #e2e8f0; --primary: #3b82f6; --primary-hover: #2563eb; --danger: #ef4444;
        }
        [data-theme="dark"] {
            --bg: #0f172a; --panel: rgba(30, 41, 59, 0.7); --text: #f8fafc; --text-muted: #94a3b8; 
            --border: #334155; --primary: #4facfe; --primary-hover: #38bdf8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.3s, border-color 0.3s; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); padding: 2rem; min-height: 100vh; }
        
        /* Auth Ekranı Stilleri */
        #authOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 10000; padding: 1rem; }
        .auth-card { background: var(--panel); backdrop-filter: blur(16px); padding: 2.5rem; border-radius: 20px; border: 1px solid var(--border); width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .auth-card h2 { font-size: 1.5rem; margin-bottom: 1.5rem; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .auth-switch { text-align: center; margin-top: 1rem; font-size: 0.85rem; color: var(--text-muted); cursor: pointer; }
        .auth-switch span { color: var(--primary); font-weight: 650; }

        .header-top { display: flex; justify-content: space-between; align-items: center; max-width: 1100px; margin: 0 auto 2rem auto; }
        .header-top h1 { display: flex; align-items: center; gap: 10px; font-size: 1.5rem; font-weight: 700; }
        .theme-toggle { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .theme-toggle:hover { color: var(--primary); border-color: var(--primary); }

        .container { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 380px 1fr; gap: 2rem; }
        .panel { background: var(--panel); backdrop-filter: blur(16px); padding: 1.5rem; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05); }
        .panel h2 { font-size: 1.1rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; display: flex; align-items: center; gap: 8px; }
        
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-muted); }
        input[type="text"], input[type="email"], input[type="password"], input[type="time"], input[type="number"], select, textarea { width: 100%; padding: 0.75rem; border: 1px solid var(--border); background: transparent; color: var(--text); border-radius: 8px; font-family: inherit; font-size: 0.875rem; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        textarea { resize: vertical; min-height: 80px; }
        
        .subtask-input-row { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
        .btn-add-sub { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 0 1rem; border-radius: 8px; cursor: pointer; font-weight: 500; }
        .btn-add-sub:hover { border-color: var(--primary); color: var(--primary); }
        .temp-subtasks { list-style: none; font-size: 0.85rem; }
        .temp-subtasks li { padding: 0.5rem 0; color: var(--text-muted); display: flex; justify-content: space-between; border-bottom: 1px dashed var(--border); }
        .remove-temp { color: var(--danger); cursor: pointer; font-size: 1.1rem; }

        .btn-save { width: 100%; background: var(--primary); color: white; border: none; padding: 0.875rem; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-save:hover { background: var(--primary-hover); transform: translateY(-1px); }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .task-list { display: flex; flex-direction: column; gap: 1rem; }
        .task-card { animation: fadeInUp 0.4s ease backwards; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 1.2rem; cursor: pointer; backdrop-filter: blur(10px); }
        .task-card:hover { transform: translateY(-3px); border-color: var(--primary); box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .task-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .task-title { font-weight: 600; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
        .task-date { font-size: 0.75rem; background: rgba(100, 116, 139, 0.1); padding: 0.3rem 0.6rem; border-radius: 6px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; }
        .task-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; }
        .delete-btn { color: var(--danger); background: none; border: none; cursor: pointer; font-size: 1.2rem; float: right; }
        .delete-btn:hover { transform: scale(1.1); }
        .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }
        .empty-state i { font-size: 4rem; color: var(--border); margin-bottom: 1rem; }

        .assignment-panel { max-width: 1100px; margin: 0 auto 2rem; }
        .assignment-form { display: grid; grid-template-columns: 1.4fr 1fr 0.8fr auto; gap: 0.75rem; align-items: end; }
        .assignment-form .form-group { margin-bottom: 0; }
        .assignment-form .btn-save { width: auto; min-width: 135px; }
        .assignment-list { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1.25rem; }
        .assignment-item { display: flex; flex-direction: column; gap: 0; padding: 0.9rem 1rem; border: 1px solid var(--border); border-radius: 10px; background: rgba(100, 116, 139, 0.05); }
        .assignment-main { display: flex; align-items: center; gap: 1rem; width: 100%; }
        .assignment-item.done { background: rgba(34, 197, 94, 0.08); border-color: rgba(34, 197, 94, 0.28); }
        .assignment-item.done .assignment-main .assignment-text { color: var(--text-muted); text-decoration: line-through; }
        .assignment-check { appearance: none; -webkit-appearance: none; width: 22px; height: 22px; flex: 0 0 22px; border: 1.5px solid #94a3b8; border-radius: 7px; background: var(--panel); cursor: pointer; display: grid; place-content: center; }
        .assignment-check::before { content: '✓'; color: #15803d; font-weight: 700; font-size: 0.85rem; transform: scale(0); transition: transform 0.15s ease; }
        .assignment-check:checked { border-color: rgba(34, 197, 94, 0.5); background: rgba(34, 197, 94, 0.16); }
        .assignment-check:checked::before { transform: scale(1); }
        .assignment-time { min-width: 115px; color: var(--primary); font-size: 0.82rem; font-weight: 700; display: flex; align-items: center; gap: 0.35rem; }
        .assignment-text { flex: 1; font-size: 0.9rem; font-weight: 600; }
        .assignment-delete { background: transparent; border: 0; color: var(--danger); cursor: pointer; font-size: 1.15rem; }
        .assignment-empty { color: var(--text-muted); font-size: 0.9rem; padding: 0.75rem 0; }
        .assignment-subtasks { margin-left: 2.7rem; margin-top: 0.75rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .subtask-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.4rem 0; border-bottom: 1px dashed var(--border); }
        .subtask-item.done .subtask-text { color: var(--text-muted); text-decoration: line-through; }
        .sub-check { width: 18px; height: 18px; flex: 0 0 18px; border-radius: 5px; }
        .subtask-text { flex: 1; font-size: 0.85rem; color: var(--text); }
        .sub-del { font-size: 1rem; color: var(--danger); opacity: 0.7; border: none; background: transparent; cursor: pointer; }
        .add-subtask-row { display: flex; gap: 0.5rem; margin-top: 0.5rem; align-items: center; }
        .add-subtask-row input { flex: 1; padding: 0.5rem 0.75rem; font-size: 0.8rem; background: var(--bg); border: 1px dashed var(--border); border-radius: 6px; color: var(--text); }

        .work-tracking-panel { max-width: 1100px; margin: 2rem auto 0; }
        .work-tracking-form { display: grid; grid-template-columns: 1fr 1fr 1fr 0.8fr 1fr auto; gap: 0.75rem; align-items: end; }
        .work-tracking-form .form-group { margin-bottom: 0; }
        .work-tracking-form .btn-save { width: auto; min-width: 145px; }
        .work-description { grid-column: 1 / -2; }
        .work-description textarea { min-height: 48px; height: 48px; }
        .work-tracking-summary { margin-top: 1.15rem; padding: 0.9rem 1rem; border-radius: 10px; background: rgba(34, 197, 94, 0.08); color: var(--text); font-size: 0.85rem; display: none; align-items: center; gap: 0.5rem; }
        .work-tracking-summary.visible { display: flex; }
        .work-tracking-summary i { color: #22c55e; font-size: 1.1rem; }
        .work-tracking-list { margin-top: 1.15rem; overflow-x: auto; }
        .work-tracking-table { width: 100%; min-width: 700px; border-collapse: collapse; font-size: 0.85rem; }
        .work-tracking-table th { padding: 0.7rem; text-align: left; color: var(--text-muted); font-size: 0.75rem; border-bottom: 1px solid var(--border); }
        .work-tracking-table td { padding: 0.8rem 0.7rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
        .month-separator td { background: rgba(59, 130, 246, 0.06); color: var(--primary); font-weight: 700; text-align: center; padding: 0.6rem; border-bottom: 1px solid rgba(59, 130, 246, 0.2); font-size: 0.95rem; }
        .tracking-icon { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; font-size: 1rem; }
        .tracking-icon.yes { background: rgba(34, 197, 94, 0.13); color: #16a34a; }
        .tracking-icon.no { background: rgba(239, 68, 68, 0.13); color: #dc2626; }
        .tracking-icon.leave { background: rgba(245, 158, 11, 0.13); color: #d97706; }
        .tracking-icon.hours { width: auto; padding: 0 10px; border-radius: 15px; font-weight: 700; font-size: 0.85rem; }
        .tracking-note { max-width: 250px; color: var(--text-muted); }
        .tracking-action { border: 0; background: transparent; cursor: pointer; font-size: 1.1rem; color: var(--text-muted); }
        .tracking-action:hover { color: var(--primary); }
        .tracking-action.delete:hover { color: var(--danger); }
        .work-tracking-empty { color: var(--text-muted); font-size: 0.9rem; padding: 0.75rem 0; text-align: center; }

        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 9999; color: var(--primary); font-size: 1.5rem; transition: opacity 0.3s; }
        
        /* Modal Stilleri */
        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: 10001; display:flex; align-items:center; justify-content:center; backdrop-filter: blur(4px); }
        .modal-content { background: var(--panel); padding: 2rem; border-radius: 16px; min-width: 380px; max-width: 95%; color: var(--text); border: 1px solid var(--border); box-shadow: 0 15px 40px rgba(0,0,0,0.2); }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1.5rem; }
        .stat-box { background: var(--bg); padding: 1.2rem; border-radius: 12px; text-align: center; border: 1px solid var(--border); box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }
        .stat-box.green { border-bottom: 3px solid #22c55e; }
        .stat-box.green .stat-num { color: #16a34a; }
        .stat-box.red { border-bottom: 3px solid #ef4444; }
        .stat-box.red .stat-num { color: #dc2626; }
        .stat-box.blue { border-bottom: 3px solid #3b82f6; }
        .stat-box.blue .stat-num { color: #2563eb; }
        .stat-box.yellow { border-bottom: 3px solid #f59e0b; }
        .stat-box.yellow .stat-num { color: #d97706; }
        .stat-title { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-num { font-size: 2rem; font-weight: 800; display: block; margin-top: 5px; }

        @media (max-width: 900px) {
            .work-tracking-form { grid-template-columns: 1fr 1fr; }
            .work-description { grid-column: 1 / -1; }
            .panel-header-row { flex-direction: column; align-items: flex-start !important; gap: 10px; }
        }
    </style>
</head>
<body>

    <!-- GİRİŞ / KAYIT EKRANI -->
    <div id="authOverlay">
        <div class="auth-card">
            <h2 id="authTitle"><i class="ph ph-lock-key"></i> Warman Giriş</h2>
            <div class="form-group">
                <label>E-posta Adresi</label>
                <input type="email" id="authEmail" placeholder="ornek@mail.com">
            </div>
            <div class="form-group">
                <label>Şifre</label>
                <input type="password" id="authPassword" placeholder="******">
            </div>
            <button class="btn-save" id="authBtn" onclick="handleAuth()"><i class="ph ph-sign-in"></i> Giriş Yap</button>
            <div class="auth-switch" onclick="toggleAuthMode()">
                <span id="authSwitchText">Hesabın yok mu? Kayıt ol</span>
            </div>
        </div>
    </div>

    <div id="loadingOverlay"><i class="ph ph-spinner ph-spin"></i> &nbsp; Oturum Kontrol Ediliyor...</div>

    <div class="header-top">
        <h1><i class="ph-fill ph-projector-screen"></i> Warman TaskFlow (Kişisel)</h1>
        <div style="display: flex; gap: 10px; align-items: center;">
            <button class="theme-toggle" onclick="logout()" title="Çıkış Yap" style="border-radius: 8px; padding: 8px 12px; font-size: 0.85rem; gap: 5px; display: flex; align-items: center;">
                <i class="ph ph-sign-out"></i> Çıkış
            </button>
            <button class="theme-toggle" onclick="toggleTheme()" title="Temayı Değiştir">
                <i class="ph ph-moon" id="themeIcon" style="font-size: 1.2rem;"></i>
            </button>
        </div>
    </div>

    <!-- GERİ KALAN ARAYÜZ (GÖREVLER VE TAKİP) -->
    <section class="panel assignment-panel">
        <h2><i class="ph ph-calendar-check"></i> Günlük Görev Atama</h2>
        <div class="assignment-form">
            <div class="form-group">
                <label for="assignmentText">O gün ne yapacaksın?</label>
                <input type="text" id="assignmentText" placeholder="Örn: Müşteri sunumunu hazırla">
            </div>
            <div class="form-group">
                <label for="assignmentDate">Tarih</label>
                <input type="text" id="assignmentDate" placeholder="Tarih seçin">
            </div>
            <div class="form-group">
                <label for="assignmentTime">Saat</label>
                <input type="text" id="assignmentTime" placeholder="Örn: 14:50" maxlength="5">
            </div>
            <button class="btn-save" onclick="saveAssignment()"><i class="ph ph-plus"></i> Görev Ekle</button>
        </div>
        <div class="assignment-list" id="assignmentList"></div>
    </section>

    <div class="container">
        <div class="panel">
            <h2><i class="ph ph-plus-circle"></i> Yeni Proje Tanımla</h2>
            <div class="form-group">
                <label>Proje Adı</label>
                <input type="text" id="taskTitle" placeholder="Örn: E-Ticaret Altyapısı">
            </div>
            <div class="form-group">
                <label>Tarih Seçimi</label>
                <input type="text" id="taskDate" placeholder="Takvimden seçiniz...">
            </div>
            <div class="form-group">
                <label>Proje Notları</label>
                <textarea id="taskDesc" placeholder="Detayları buraya girin..."></textarea>
            </div>
            <div class="form-group">
                <label>Hızlı Yapılacaklar</label>
                <div class="subtask-input-row">
                    <input type="text" id="subtaskInput" placeholder="Madde ekle...">
                    <button class="btn-add-sub" onclick="addTempSubtask()"><i class="ph ph-plus"></i></button>
                </div>
                <ul class="temp-subtasks" id="tempSubtaskList"></ul>
            </div>
            <button class="btn-save" onclick="saveTask()">
                <i class="ph ph-cloud-arrow-up"></i> Buluta Kaydet
            </button>
        </div>

        <div class="panel">
            <h2><i class="ph ph-kanban"></i> Aktif İş Akışları</h2>
            <div class="task-list" id="taskList"></div>
        </div>
    </div>

    <!-- İŞ TAKİBİ PANELİ VE YENİ BUTONLAR -->
    <section class="panel work-tracking-panel">
        <div class="panel-header-row" style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.8rem;">
            <h2 style="margin:0; border:none; padding:0;"><i class="ph ph-briefcase"></i> İş Takibi</h2>
            <div style="display:flex; gap:10px; align-items:center; flex-wrap: wrap;">
                <!-- Arşiv Seçici -->
                <select id="viewArchiveSelect" onchange="changeArchiveView()" style="padding: 0.5rem; font-size:0.85rem; width:auto; border-radius:8px; font-weight:600; cursor:pointer;">
                    <option value="active">Güncel Dönem</option>
                </select>
                <!-- İstatistik Butonu -->
                <button class="btn-save" style="padding: 0.5rem 1rem; font-size: 0.85rem; width:auto; background: #3b82f6;" onclick="showStatistics()">
                    <i class="ph ph-chart-bar"></i> İstatistik
                </button>
                <!-- Maaş Tamam (Arşivle) Butonu -->
                <button class="btn-save" style="padding: 0.5rem 1rem; font-size: 0.85rem; width:auto; background: #ef4444;" onclick="archiveCurrentMonth()">
                    <i class="ph ph-archive"></i> Maaşı Kapat (Log)
                </button>
            </div>
        </div>

        <div class="work-tracking-form">
            <div class="form-group">
                <label for="workTrackingDate">Tarih</label>
                <input type="text" id="workTrackingDate" placeholder="Tarih seçin">
            </div>
            <div class="form-group">
                <label for="attendanceStatus">İşe gelme durumu</label>
                <select id="attendanceStatus">
                    <option value="">Seçim yapın</option>
                    <option value="İşe geldim">✅ İşe geldim</option>
                    <option value="Gelmedim">❌ Gelmedim</option>
                    <option value="İzinliyim">🟡 İzinliyim</option>
                </select>
            </div>
            <div class="form-group">
                <label for="overtimeStatus">Mesai durumu</label>
                <select id="overtimeStatus" onchange="toggleOvertimeInput()">
                    <option value="">Seçim yapın</option>
                    <option value="Mesai yaptım">✅ Mesai yaptım</option>
                    <option value="Mesai yapmadım">❌ Mesai yapmadım</option>
                </select>
            </div>
            <div class="form-group" id="overtimeHoursGroup" style="display: none;">
                <label for="overtimeHours">Kaç Saat?</label>
                <input type="number" id="overtimeHours" placeholder="Örn: 2" min="1">
            </div>
            <div class="form-group">
                <label for="workLocation">Çalışma yeri</label>
                <select id="workLocation">
                    <option value="">Seçim yapın</option>
                    <option value="Merkez">🏢 Merkez</option>
                    <option value="İvedik">🏭 İvedik</option>
                    <option value="Saha">🦺 Saha</option>
                    <option value="Uzaktan">🏠 Uzaktan</option>
                </select>
            </div>
            <div class="form-group work-description">
                <label for="workDescription">Açıklama</label>
                <textarea id="workDescription" placeholder="Bugün yaptıklarınız veya notunuz..."></textarea>
            </div>
            <button class="btn-save" type="button" onclick="saveWorkTracking()"><i class="ph ph-check"></i> Kaydı Kaydet</button>
        </div>
        
        <div class="work-tracking-summary" id="workTrackingSummary" role="status"></div>
        <div class="work-tracking-list" id="workTrackingList"></div>
    </section>

    <!-- İSTATİSTİK MODAL PENCERESİ -->
    <div id="statsModal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid var(--border); padding-bottom: 1rem;">
                <h3 style="margin:0; display:flex; align-items:center; gap:8px;"><i class="ph-fill ph-chart-pie-slice" style="color:var(--primary);"></i> Dönem İstatistikleri</h3>
                <button onclick="closeStatistics()" style="background:transparent; border:none; font-size:1.8rem; cursor:pointer; color:var(--text-muted);">&times;</button>
            </div>
            <div id="statsContent" class="stat-grid">
                <!-- Javascript ile doldurulacak -->
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://gpdvqhdhbreiqazlvwlh.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdwZHZxaGRoYnJlaXFhemx2d2xoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTkxMzYsImV4cCI6MjEwNDkzNTEzNn0.vfqPZuGNIwch5MjxDAeCAxCzkIplC3JFbXvdQAGBE58';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let tasks = [];
        let assignments = [];
        let allWorkTrackingRecords = []; // Bütün verileri burada tutacağız
        let currentArchiveView = 'active'; // active = Güncel Dönem, yoksa Log Adı
        let currentSubtasks = [];
        let isSignUpMode = false;
        const aylar = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];

        // Auth Kontrolü
        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                document.getElementById('authOverlay').style.display = 'none';
                loadCloudData();
            } else {
                document.getElementById('authOverlay').style.display = 'flex';
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        }

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            document.getElementById('authTitle').innerHTML = isSignUpMode ? '<i class="ph ph-user-plus"></i> Warman Kayıt' : '<i class="ph ph-lock-key"></i> Warman Giriş';
            document.getElementById('authBtn').innerHTML = isSignUpMode ? '<i class="ph ph-user-plus"></i> Kayıt Ol' : '<i class="ph ph-sign-in"></i> Giriş Yap';
            document.getElementById('authSwitchText').innerHTML = isSignUpMode ? 'Zaten hesabın var mı? Giriş yap' : 'Hesabın yok mu? Kayıt ol';
        }

        async function handleAuth() {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            if (!email || !password) return alert('E-posta ve şifre giriniz.');

            if (isSignUpMode) {
                const { error } = await supabaseClient.auth.signUp({ email, password });
                if (error) alert('Kayıt hatası: ' + error.message);
                else { alert('Kayıt başarılı! Şimdi giriş yapabilirsiniz.'); toggleAuthMode(); }
            } else {
                const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) alert('Giriş hatası: ' + error.message);
                else { location.reload(); }
            }
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            location.reload();
        }

        // API İstek Fonksiyonu
        async function supabaseRequest(endpoint, method = 'GET', data = null) {
            const options = {
                method: method,
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${(await supabaseClient.auth.getSession()).data.session?.access_token}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=representation'
                }
            };
            if (data) options.body = JSON.stringify(data);
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`, options);
                if (!response.ok) throw new Error(response.statusText);
                if (method !== 'DELETE') return await response.json();
            } catch (err) { console.error("Supabase Hatası:", err); }
        }

        async function loadCloudData() {
            try {
                const [pData, aData, wData] = await Promise.all([
                    supabaseRequest('projects?select=*&order=id.desc'),
                    supabaseRequest('assignments?select=*&order=id.desc'),
                    supabaseRequest('work_tracking?select=*&order=id.desc')
                ]);

                tasks = (pData || []).map(p => ({ ...p, subtasks: JSON.parse(p.subtasks_json || '[]') }));
                assignments = (aData || []).map(a => ({ ...a, subtasks: JSON.parse(a.subtasks_json || '[]') }));
                allWorkTrackingRecords = wData || [];

                renderTasks(); 
                renderAssignments(); 
                populateArchiveDropdown();
                renderWorkTrackingRecords();
                
                document.getElementById('loadingOverlay').style.opacity = '0';
                setTimeout(() => document.getElementById('loadingOverlay').style.display = 'none', 300);
            } catch(e) { alert("Veriler yüklenirken hata oluştu!"); }
        }

        const currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
        document.getElementById('themeIcon').className = currentTheme === 'dark' ? 'ph ph-sun' : 'ph ph-moon';

        function toggleTheme() {
            const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            document.getElementById('themeIcon').className = theme === 'dark' ? 'ph ph-sun' : 'ph ph-moon';
        }

        function formatDetailedDate(dateStr) {
            if (!dateStr) return 'Tarihsiz';
            if (dateStr.includes('.')) {
                const parts = dateStr.split('.');
                if (parts.length === 3) {
                    const d = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
                    return d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric', weekday: 'long' });
                }
            }
            return dateStr;
        }

        const fpOptions = { locale: "tr", dateFormat: "d.m.Y", altInput: true, altFormat: "d F Y l", allowInput: true };
        flatpickr("#taskDate", fpOptions);
        flatpickr("#assignmentDate", { ...fpOptions, defaultDate: new Date() });
        flatpickr("#workTrackingDate", { ...fpOptions, defaultDate: new Date() });

        document.getElementById('assignmentTime').addEventListener('input', function(e) {
            let val = this.value.replace(/\D/g, ''); 
            if (val.length >= 3) val = val.substring(0, 2) + ':' + val.substring(2, 4);
            this.value = val;
        });

        // --- İŞ TAKİBİ ARŞİV VE İSTATİSTİK ---
        
        function populateArchiveDropdown() {
            const select = document.getElementById('viewArchiveSelect');
            const archives = [...new Set(allWorkTrackingRecords.map(r => r.archive_id).filter(Boolean))];
            
            let optionsHTML = `<option value="active">Güncel Dönem</option>`;
            archives.forEach(arc => {
                optionsHTML += `<option value="${arc}">📁 ${arc}</option>`;
            });
            select.innerHTML = optionsHTML;
            select.value = currentArchiveView;
        }

        function changeArchiveView() {
            currentArchiveView = document.getElementById('viewArchiveSelect').value;
            renderWorkTrackingRecords();
        }

        function showStatistics() {
            // Ekranda seçili olan dönemin kayıtlarını al
            const recordsToStat = allWorkTrackingRecords.filter(r => currentArchiveView === 'active' ? !r.archive_id : r.archive_id === currentArchiveView);
            
            let geldi = 0, gelmedi = 0, izinli = 0, mesaiSaat = 0;
            
            recordsToStat.forEach(r => {
                if(r.attendance === 'İşe geldim') geldi++;
                if(r.attendance === 'Gelmedim') gelmedi++;
                if(r.attendance === 'İzinliyim') izinli++;
                if(r.overtime === 'Mesai yaptım' && r.overtime_hours) {
                    mesaiSaat += parseInt(r.overtime_hours) || 0;
                }
            });

            document.getElementById('statsContent').innerHTML = `
                <div class="stat-box green">
                    <span class="stat-title">İşe Geldi</span>
                    <span class="stat-num">${geldi} Gün</span>
                </div>
                <div class="stat-box blue">
                    <span class="stat-title">Toplam Mesai</span>
                    <span class="stat-num">${mesaiSaat} Saat</span>
                </div>
                <div class="stat-box yellow">
                    <span class="stat-title">İzinli</span>
                    <span class="stat-num">${izinli} Gün</span>
                </div>
                <div class="stat-box red">
                    <span class="stat-title">Gelmedi</span>
                    <span class="stat-num">${gelmedi} Gün</span>
                </div>
            `;
            document.getElementById('statsModal').style.display = 'flex';
        }

        function closeStatistics() {
            document.getElementById('statsModal').style.display = 'none';
        }

        async function archiveCurrentMonth() {
            if(currentArchiveView !== 'active') {
                return alert('Hata: Sadece Güncel Dönemi (Aktif Ayı) arşivleyebilirsiniz.');
            }
            
            const activeRecords = allWorkTrackingRecords.filter(r => !r.archive_id);
            if(activeRecords.length === 0) {
                return alert('Arşivlenecek güncel kayıt bulunamadı. Zaten temiz bir sayfadasınız.');
            }

            const archiveName = prompt("Bu dönemi (ayı) kapatıp log olarak arşive kaldırmak istiyor musunuz?\n\nLütfen arşiv adı girin (Örn: 1. Ay Log, Eylül 2026):");
            if(!archiveName || archiveName.trim() === '') return;

            // Supabase Toplu Güncelleme (REST API Filtresi ile)
            await supabaseRequest('work_tracking?archive_id=is.null', 'PATCH', { archive_id: archiveName.trim() });
            
            // Lokalde de kaydet
            allWorkTrackingRecords.forEach(r => {
                if(!r.archive_id) r.archive_id = archiveName.trim();
            });

            alert(`Dönem başarıyla "${archiveName}" olarak kapatıldı!\nArtık yepyeni bir maaş dönemine temiz başlayabilirsiniz.`);
            
            // Menüyü güncelle ve temiz sayfaya (Güncel Dönem'e) dön
            currentArchiveView = 'active'; 
            populateArchiveDropdown();
            renderWorkTrackingRecords();
        }

        function toggleOvertimeInput() {
            const status = document.getElementById('overtimeStatus').value;
            const hoursGroup = document.getElementById('overtimeHoursGroup');
            if (status === 'Mesai yaptım') {
                hoursGroup.style.display = 'block';
                document.getElementById('overtimeHours').focus();
            } else {
                hoursGroup.style.display = 'none';
                document.getElementById('overtimeHours').value = '';
            }
        }

        async function saveWorkTracking() {
            const date = document.getElementById('workTrackingDate').value;
            const attendance = document.getElementById('attendanceStatus').value;
            const overtime = document.getElementById('overtimeStatus').value;
            let overtime_hours = document.getElementById('overtimeHours').value.trim(); 
            const location = document.getElementById('workLocation').value;
            const description = document.getElementById('workDescription').value.trim();

            if (!date || !attendance || !overtime || !location) return alert('Tarih, işe gelme, mesai ve konum zorunludur.');
            if (overtime === 'Mesai yaptım' && !overtime_hours) return alert('Lütfen kaç saat mesai yaptığınızı girin.');
            if (overtime !== 'Mesai yaptım') overtime_hours = null;

            // Hangi döneme kaydediyoruz? Eğer geçmiş döneme bakıyorsak, o geçmiş dönemin adıyla kaydetsin (veya null ise active)
            const targetArchiveId = currentArchiveView === 'active' ? null : currentArchiveView;

            const existingIndex = allWorkTrackingRecords.findIndex(item => item.date === date && item.archive_id === targetArchiveId);
            let record;

            if (existingIndex >= 0) {
                record = { ...allWorkTrackingRecords[existingIndex], attendance, overtime, overtime_hours, location, description };
                allWorkTrackingRecords[existingIndex] = record;
                renderWorkTrackingRecords();
                await supabaseRequest(`work_tracking?id=eq.${record.id}`, 'PATCH', record);
            } else {
                record = { id: Date.now(), date, attendance, overtime, overtime_hours, location, description, archive_id: targetArchiveId };
                allWorkTrackingRecords.unshift(record);
                renderWorkTrackingRecords();
                await supabaseRequest('work_tracking', 'POST', record);
            }

            document.getElementById('workDescription').value = '';
            document.getElementById('overtimeHours').value = ''; 
            toggleOvertimeInput();
            
            const currentFilteredRecords = allWorkTrackingRecords.filter(r => currentArchiveView === 'active' ? !r.archive_id : r.archive_id === currentArchiveView);
            renderWorkTrackingSummary(currentFilteredRecords[0]);
        }

        function renderWorkTrackingSummary(record) {
            const summary = document.getElementById('workTrackingSummary');
            if (!record) { summary.classList.remove('visible'); return; }
            
            let otText = record.overtime;
            if(record.overtime === 'Mesai yaptım' && record.overtime_hours) {
                otText += ` (${record.overtime_hours} Saat)`;
            }

            summary.innerHTML = `<i class="ph ph-check-circle"></i><span><strong>${formatDetailedDate(record.date)}</strong> için kaydedildi: ${record.attendance} · ${otText} · ${record.location}</span>`;
            summary.classList.add('visible');
        }

        function editWorkTracking(originalId) {
            const record = allWorkTrackingRecords.find(r => r.id === originalId);
            if (!record) return;
            document.getElementById('workTrackingDate')._flatpickr.setDate(record.date, true, 'd.m.Y');
            document.getElementById('attendanceStatus').value = record.attendance;
            document.getElementById('overtimeStatus').value = record.overtime;
            
            document.getElementById('overtimeHours').value = record.overtime_hours || '';
            toggleOvertimeInput();

            document.getElementById('workLocation').value = record.location;
            document.getElementById('workDescription').value = record.description || '';
        }

        async function deleteWorkTracking(originalId) {
            const recordIndex = allWorkTrackingRecords.findIndex(r => r.id === originalId);
            if (recordIndex === -1) return;
            const record = allWorkTrackingRecords[recordIndex];
            
            if (!confirm(`${formatDetailedDate(record.date)} tarihli kaydı silmek istediğinize emin misiniz?`)) return;
            
            allWorkTrackingRecords.splice(recordIndex, 1);
            renderWorkTrackingRecords();
            
            const currentFilteredRecords = allWorkTrackingRecords.filter(r => currentArchiveView === 'active' ? !r.archive_id : r.archive_id === currentArchiveView);
            renderWorkTrackingSummary(currentFilteredRecords[0]);
            
            await supabaseRequest(`work_tracking?id=eq.${record.id}`, 'DELETE');
        }
        
        function renderWorkTrackingRecords() {
            const list = document.getElementById('workTrackingList');
            
            // SADECE SEÇİLİ DÖNEMİ FİLTRELE
            const filteredRecords = allWorkTrackingRecords.filter(r => currentArchiveView === 'active' ? !r.archive_id : r.archive_id === currentArchiveView);

            if (filteredRecords.length === 0) {
                if(currentArchiveView === 'active') {
                    list.innerHTML = '<p class="work-tracking-empty">Yeni dönem (maaş ayı) temiz. Henüz kayıt yok!</p>';
                } else {
                    list.innerHTML = '<p class="work-tracking-empty">Bu arşivde kayıt bulunamadı.</p>';
                }
                return;
            }

            const parseDate = val => { const [d,m,y] = val.split('.'); return new Date(`${y}-${m}-${d}`); };
            const orderedRecords = filteredRecords.sort((a, b) => parseDate(b.date) - parseDate(a.date));
            
            const attIcon = val => val === 'İşe geldim' ? '<span class="tracking-icon yes">✓</span>' : val === 'İzinliyim' ? '<span class="tracking-icon leave">−</span>' : '<span class="tracking-icon no">✕</span>';
            const ovIcon = (val, hours) => {
                if (val === 'Mesai yaptım') {
                    return hours ? `<span class="tracking-icon yes hours">✓ ${hours} Saat</span>` : '<span class="tracking-icon yes">✓</span>';
                }
                return '<span class="tracking-icon no">✕</span>';
            };
            const locIcon = val => ({ Merkez: '🏢', İvedik: '🏭', Saha: '🦺', Uzaktan: '🏠' }[val] || '📍');

            let currentMonthYear = "";
            let tableHTML = `<table class="work-tracking-table"><thead><tr><th>Tarih</th><th>Geldi</th><th>Mesai</th><th>Konum</th><th>Açıklama</th><th>İşlem</th></tr></thead><tbody>`;

            orderedRecords.forEach(record => {
                const [day, month, year] = record.date.split('.');
                const recordMonthYear = `${aylar[parseInt(month) - 1]} ${year}`;

                if (recordMonthYear !== currentMonthYear) {
                    tableHTML += `<tr class="month-separator"><td colspan="6"><i class="ph ph-calendar-blank"></i> ${recordMonthYear} Başlangıcı</td></tr>`;
                    currentMonthYear = recordMonthYear;
                }

                tableHTML += `<tr>
                    <td class="work-tracking-date">${formatDetailedDate(record.date)}</td>
                    <td>${attIcon(record.attendance)}</td>
                    <td>${ovIcon(record.overtime, record.overtime_hours)}</td>
                    <td title="${escapeHtml(record.location)}">${locIcon(record.location)}</td>
                    <td class="tracking-note">${record.description ? `💬 ${escapeHtml(record.description)}` : '—'}</td>
                    <td>
                        <button class="tracking-action" onclick="editWorkTracking(${record.id})" title="Düzenle"><i class="ph ph-pencil-simple"></i></button>
                        <button class="tracking-action delete" onclick="deleteWorkTracking(${record.id})" title="Sil"><i class="ph ph-trash"></i></button>
                    </td>
                </tr>`;
            });
            list.innerHTML = tableHTML + `</tbody></table>`;
        }

        // --- PROJELER ---
        function addTempSubtask() {
            const input = document.getElementById('subtaskInput');
            if (input.value.trim()) {
                currentSubtasks.push({ id: Date.now(), text: input.value.trim() });
                input.value = ''; renderTempSubtasks();
            }
        }
        function removeTempSubtask(id) { currentSubtasks = currentSubtasks.filter(sub => sub.id !== id); renderTempSubtasks(); }
        function renderTempSubtasks() {
            document.getElementById('tempSubtaskList').innerHTML = currentSubtasks.map(sub => `<li>- ${sub.text} <span class="remove-temp" onclick="removeTempSubtask(${sub.id})"><i class="ph ph-x"></i></span></li>`).join('');
        }

        async function saveTask() {
            const title = document.getElementById('taskTitle').value.trim();
            if (!title) return alert('Proje adı zorunludur.');

            const newId = Date.now();
            const newTask = {
                id: newId,
                title: title,
                date: document.getElementById('taskDate').value,
                description: document.getElementById('taskDesc').value.trim(),
                subtasks_json: JSON.stringify(currentSubtasks)
            };

            await supabaseRequest('projects', 'POST', newTask);
            window.location.href = `task.html?id=${newId}`;
        }

        function renderTasks() {
            const list = document.getElementById('taskList');
            if(tasks.length === 0) return list.innerHTML = `<div class="empty-state"><i class="ph-duotone ph-folder-dashed"></i><p>Henüz bir proje eklenmemiş.</p></div>`;
            
            list.innerHTML = tasks.map((task, i) => `
                <div class="task-card" style="animation-delay: ${i * 0.1}s" onclick="goToFlow(${task.id})">
                    <div class="task-header">
                        <span class="task-title"><i class="ph-fill ph-folder-open" style="color: var(--primary);"></i> ${escapeHtml(task.title)}</span>
                        <span class="task-date"><i class="ph ph-calendar-blank"></i> ${formatDetailedDate(task.date)}</span>
                    </div>
                    <div class="task-desc">${task.description ? escapeHtml(task.description).substring(0, 50) + '...' : 'Açıklama girilmemiş.'}</div>
                    <div style="font-size: 0.85rem; color: var(--primary); font-weight: 500; display:flex; align-items:center; gap:5px;"><i class="ph ph-share-network"></i> E-Flow Çiz</div>
                    <button class="delete-btn" onclick="event.stopPropagation(); deleteTask(${task.id})" title="Sil"><i class="ph ph-trash"></i></button>
                </div>
            `).join('');
        }

        async function deleteTask(id) {
            if(confirm('Projeyi silmek istediğinize emin misiniz?')) {
                tasks = tasks.filter(t => t.id !== id);
                renderTasks();
                await supabaseRequest(`projects?id=eq.${id}`, 'DELETE');
            }
        }

        // --- GÜNLÜK GÖREVLER ---
        async function saveAssignment() {
            const text = document.getElementById('assignmentText').value.trim();
            const date = document.getElementById('assignmentDate').value;
            let time = document.getElementById('assignmentTime').value.trim();

            if (!text || !date || !time) return alert('Görev, tarih ve saat zorunludur.');
            if (!/^\d{2}:\d{2}$/.test(time)) return alert('Saati doğru formatta girin (Örn: 14:50).');

            const newAssig = { id: Date.now(), text, date, time, completed: false, subtasks_json: JSON.stringify([]) };
            assignments.push({ ...newAssig, subtasks: [] });
            
            document.getElementById('assignmentText').value = ''; document.getElementById('assignmentTime').value = '';
            renderAssignments();
            await supabaseRequest('assignments', 'POST', newAssig);
        }

        async function deleteAssignment(id) {
            assignments = assignments.filter(a => a.id !== id);
            renderAssignments();
            await supabaseRequest(`assignments?id=eq.${id}`, 'DELETE');
        }

        async function toggleAssignmentDone(id) {
            const assignment = assignments.find(a => a.id === id);
            if (assignment) {
                assignment.completed = !assignment.completed;
                renderAssignments();
                await supabaseRequest(`assignments?id=eq.${id}`, 'PATCH', { completed: assignment.completed });
            }
        }

        async function addAssignmentSubtask(assignmentId) {
            const input = document.getElementById(`assignSubInput_${assignmentId}`);
            if (!input.value.trim()) return;
            const assignment = assignments.find(a => a.id === assignmentId);
            if (assignment) {
                assignment.subtasks.push({ id: Date.now(), text: input.value.trim(), completed: false });
                renderAssignments();
                await supabaseRequest(`assignments?id=eq.${assignmentId}`, 'PATCH', { subtasks_json: JSON.stringify(assignment.subtasks) });
            }
        }

        async function toggleAssignmentSubtaskDone(assignmentId, subtaskId) {
            const assignment = assignments.find(a => a.id === assignmentId);
            if (assignment) {
                const sub = assignment.subtasks.find(s => s.id === subtaskId);
                if (sub) {
                    sub.completed = !sub.completed;
                    renderAssignments();
                    await supabaseRequest(`assignments?id=eq.${assignmentId}`, 'PATCH', { subtasks_json: JSON.stringify(assignment.subtasks) });
                }
            }
        }

        async function deleteAssignmentSubtask(assignmentId, subtaskId) {
            const assignment = assignments.find(a => a.id === assignmentId);
            if (assignment) {
                assignment.subtasks = assignment.subtasks.filter(s => s.id !== subtaskId);
                renderAssignments();
                await supabaseRequest(`assignments?id=eq.${assignmentId}`, 'PATCH', { subtasks_json: JSON.stringify(assignment.subtasks) });
            }
        }

        function escapeHtml(value) { return value.replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[c]); }

        function renderAssignments() {
            const list = document.getElementById('assignmentList');
            if (assignments.length === 0) return list.innerHTML = '<p class="assignment-empty">Henüz planlanmış bir görevin yok.</p>';

            const ordered = [...assignments].sort((a, b) => {
                const toDate = item => { const [d,m,y] = item.date.split('.'); return new Date(`${y}-${m}-${d}T${item.time}`); };
                return toDate(a) - toDate(b);
            });

            list.innerHTML = ordered.map(a => `
                <div class="assignment-item ${a.completed ? 'done' : ''}">
                    <div class="assignment-main">
                        <input class="assignment-check" type="checkbox" ${a.completed ? 'checked' : ''} onchange="toggleAssignmentDone(${a.id})">
                        <span class="assignment-time"><i class="ph ph-calendar-blank"></i> ${formatDetailedDate(a.date)} · ${a.time}</span>
                        <span class="assignment-text">${escapeHtml(a.text)}</span>
                        <button class="assignment-delete" onclick="deleteAssignment(${a.id})"><i class="ph ph-trash"></i></button>
                    </div>
                    <div class="assignment-subtasks">
                        ${(a.subtasks || []).map(sub => `
                            <div class="subtask-item ${sub.completed ? 'done' : ''}">
                                <input class="assignment-check sub-check" type="checkbox" ${sub.completed ? 'checked' : ''} onchange="toggleAssignmentSubtaskDone(${a.id}, ${sub.id})">
                                <span class="subtask-text">${escapeHtml(sub.text)}</span>
                                <button class="sub-del" onclick="deleteAssignmentSubtask(${a.id}, ${sub.id})"><i class="ph ph-x"></i></button>
                            </div>
                        `).join('')}
                        <div class="add-subtask-row">
                            <input type="text" id="assignSubInput_${a.id}" placeholder="Alt görev ekle..." onkeydown="if(event.key==='Enter')addAssignmentSubtask(${a.id})">
                            <button class="btn-add-sub" onclick="addAssignmentSubtask(${a.id})"><i class="ph ph-plus"></i></button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function goToFlow(id) { window.location.href = `task.html?id=${id}`; }

        // SAYFA YÜKLENDİĞİNDE OTURUMU KONTROL ET
        window.onload = checkAuth;
    </script>
</body>
</html>
